apiVersion: v1alpha1
kind: Role
metadata:
  name: warm-diary-public
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
    rbac.authorization.halo.run/aggregate-to-authenticated: "true"
rules:
  - apiGroups: ["api.warm-diary.timxs.com"]
    resources: ["readableentries", "readablecalendar", "session"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/diary", "/diary/*"]
    verbs: ["get"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: warm-diary-manage
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/display-name: "暖阳日记管理"
    rbac.authorization.halo.run/module: "暖阳日记"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:warm-diary:manage"]
rules:
  # Entry points only: 写日记与读未分享内容都经这些端点，权限由角色判定。
  # Never grant roles access to raw diaryentries CRDs.
  - apiGroups: ["console.api.warm-diary.timxs.com"]
    resources: ["entries"]
    verbs: ["get", "list", "create", "update"]
  - apiGroups: ["console.api.warm-diary.timxs.com"]
    resources: ["entries/publish", "entries/unpublish", "entries/trash", "entries/restore", "entries/delete"]
    verbs: ["create"]

plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group 'com.timxs.warmdiary'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.26.0')
    compileOnly 'run.halo.app:api'
    implementation 'org.jsoup:jsoup:1.21.2'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.26'
}

haloPlugin {
    openApi {
        useExistingServer = true
        apiDocsUrl = providers.gradleProperty('haloApiUrl').getOrElse('http://127.0.0.1:8098')
        outputDir = file("$rootDir/api-docs/openapi/v3_0")
        groupingRules {
            warmDiary {
                displayName = 'Extension API for Warm Diary'
                pathsToMatch = [
                    '/apis/console.api.warm-diary.timxs.com/v1alpha1/**',
                    '/apis/api.warm-diary.timxs.com/v1alpha1/**'
                ]
            }
        }
        groupedApiMappings = [
            '/v3/api-docs/warmDiary': 'warmDiary.json'
        ]
        generator {
            outputDir = file("${projectDir}/ui/src/api/generated")
            additionalProperties = [
                useES6: true,
                useSingleRequestParameter: true,
                withSeparateModelsAndApi: true,
                apiPackage: 'api',
                modelPackage: 'models'
            ]
            typeMappings = [
                set: 'Array'
            ]
        }
    }
}

tasks.register('processUiResources', Sync) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
    dependsOn tasks.named('processNotebookResources')
}

tasks.register('processNotebookResources', Sync) {
    from project(':ui').layout.buildDirectory.dir('notebook')
    into layout.buildDirectory.dir('resources/main/static/notebook')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}
